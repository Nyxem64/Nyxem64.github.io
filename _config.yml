collections:
  tutorial:
    output: true
    permalink: /:collection/:name

defaults:
  - scope:
      path: ""
      type: "game"
    values:
      layout: "game"
  - scope:
      path: ""
      type: "tutorial"
    values:
      layout: "tutorial"
  - scope:
      path: ""
    values:
      layout: "default"
      permalink: "none"
